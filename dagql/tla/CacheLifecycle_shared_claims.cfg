\* The egraphMu read sections overlapping. The lookup hit and the ID-load
\* claim run as separate selection and claim steps (SharedSections =
\* "split"): other sessions' read sections, release marking and its
\* sessionMu snapshot and every lock-free step interleave between
\* them, while write-locked steps wait for the claim. Two sessions and
\* three invocations let two sessions' hits, a nested ID load and a release
\* overlap on one result. Prune and persistable requests are off: prune is
\* write-locked, so it only waits while a read section is open, and a
\* persistable hit never takes the read path in Go (it teaches the e-graph
\* under the write lock). With both on, the run did not finish in 34
\* minutes at four TLC workers.
\* Expected: pass.
