\* Probe on callrec_restart's scope: a call entry saved by Flush is restored
\* by Restart with its link (restored, not recorded after the restart).
\* Expected: violates ProbeCallEntryRestored (the witness is reached).
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 3
    InvocationLimit <- TwoCallsBeforeRestart
    MaxResults = 3
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
CONSTRAINT CallOrderScenario
INVARIANTS ProbeCallEntryRestored
