\* Call entries at publication (cache_call_record.go). cA's resolver loads
\* cB's published value and returns it, so cA's persisted publication adopts
\* it and records cA as a call entry whose value is cB's entry. One session,
\* three calls of either call, release, no expiry: later calls of cA hit
\* through the call entry, adopt it or recompute beside it.
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 3
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
SYMMETRY SymmCalls
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall NoPersistedAttachErroredResult NoErroredLookupSelection ReturnedLive ReturnedOwned NoHalfAttachedRead SharedLeaseReleasedWhenRetired PersistableIntentDurable CallEntryNeverServed CallEntryHoldsReturned CallEntryNeverDecoded
