\* Call entries across a restart. Scenario (CONSTRAINT CallOrderScenario):
\* cB, then cA, then after the restart cA again; the cA calls are
\* persistable. cA's publication records a call entry over cB's value; Flush
\* saves it with its returned_ref link and Restart restores it undecoded;
\* a call after the restart can hit through it. At most two calls before
\* the restart and one after (the constraint fixes their order, not that the
\* restart comes after them); drained release.
\* Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 3
    InvocationLimit <- TwoCallsBeforeRestart
    MaxResults = 3
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = FALSE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = TRUE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
CONSTRAINT CallOrderScenario
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall NoPersistedAttachErroredResult NoErroredLookupSelection ReturnedLive ReturnedOwned NoHalfAttachedRead SharedLeaseReleasedWhenRetired PersistableIntentDurable FlushReferentialIntegrity NoDirtySnapshotResultServed CallEntryNeverServed CallEntryHoldsReturned CallEntryNeverDecoded
