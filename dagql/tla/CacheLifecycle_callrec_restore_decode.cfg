    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    RestoreSkipsCallEntry <- GuardOff
CONSTRAINT CallOrderScenario
INVARIANTS TypeOK OwnershipExact NoUnderflow NoResurrection OneLiveEntryPerCall NoPersistedAttachErroredResult NoErroredLookupSelection ReturnedLive ReturnedOwned NoHalfAttachedRead SharedLeaseReleasedWhenRetired PersistableIntentDurable FlushReferentialIntegrity NoDirtySnapshotResultServed CallEntryNeverServed CallEntryHoldsReturned CallEntryNeverDecoded
