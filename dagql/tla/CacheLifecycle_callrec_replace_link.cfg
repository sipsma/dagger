\* Mutation of callrec_expiry: a replacement in place keeps the old call
\* entry's link (ReplaceSetsReturned off). It checks only the property this
\* rule protects: the publication also holds the replaced entry for its
\* waiters in the same state, which CallEntryNeverServed would report.
\* Expected: violates CallEntryHoldsReturned.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 3
    MaxResults = 3
    Handles = {}
    AllowRelease = FALSE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = TRUE
    ModelMerge = FALSE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = FALSE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    ReplaceSetsReturned <- GuardOff
SYMMETRY SymmCalls
INVARIANTS TypeOK OwnershipExact CallEntryHoldsReturned
PROPERTY NoReplaceUnderUser
