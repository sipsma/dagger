\* Mutation of callrec_merge: lookup, canonical adoption and inner loads
\* serve a call entry itself (ServeReturnedGuard off). It checks only the
\* property this rule protects: the hit that selects the call entry also
\* decodes it, which CallEntryNeverDecoded would catch first or not,
\* depending on TLC's worker order.
\* Expected: violates CallEntryNeverServed.
SPECIFICATION Spec
CONSTANTS
    Sessions = {s1}
    s1 = s1
    Calls = {cA, cB}
    cA = cA
    cB = cB
    ClassOf <- OneClass
    MaxInvocations = 1
    MaxResults = 3
    Handles = {}
    AllowRelease = TRUE
    ReleaseSessions <- AllSessions
    PersistableIntent = TRUE
    DrainOnRelease = TRUE
    AllowPruneCut = FALSE
    AllowExpire = TRUE
    ModelMerge = TRUE
    ModelLazy = FALSE
    MaxEvals = 0
    LazyGroups <- WholeGroups
    LazyParts <- WholeParts
    PartGroupOf <- WholePartGroupOf
    GroupNeeds <- NoGroupNeeds
    ModelContainerPartPersistence = FALSE
    ModelPartDelegation = FALSE
    ModelPersistence = FALSE
    ImportInit = FALSE
    ModelNestedCalls = FALSE
    ModelLateDeps = FALSE
    FnCanFail = FALSE
    AttachCanFail = TRUE
    LeaseCanFail = FALSE
    ReaderCanCancel = FALSE
    LazyCanFail = FALSE
    DecodeCanFail = FALSE
    DelegatedReleaseOnly = FALSE
    ServeReturnedGuard <- GuardOff
SYMMETRY SymmCalls
INVARIANTS TypeOK OwnershipExact CallEntryNeverServed
PROPERTY NoReplaceUnderUser
