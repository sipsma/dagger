# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.go-sdk]
source = "github.com/dagger/go-sdk"

[sdks.go]
module = "go-sdk"

[modules.gcexp]
source = ".dagger/modules/gcexp"

[sdks.go.scopes.".dagger/modules/gcexp"]
is-module = true
name = "gcexp"
